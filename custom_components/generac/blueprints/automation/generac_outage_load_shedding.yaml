blueprint:
  name: Generac Outage Load Shedding
  description: >-
    Automatically turn off high-draw appliances or circuits when a Generac
    generator transitions to "Running" (ignoring scheduled "Exercising"
    cycles), wait for utility power to stabilize in "Ready", and optionally
    restore shed loads with a stagger delay.
  domain: automation
  author: ha-generac
  input:
    generator_status:
      name: Generator Status Sensor
      description: Generac status sensor for your generator.
      selector:
        entity:
          filter:
            - integration: generac
              domain: sensor
    shed_entities:
      name: High-Draw Entities to Shed
      description: >-
        Entities (switches, climates, water heaters, EV chargers, etc.) to
        turn off while running on generator power.
      selector:
        entity:
          multiple: true
    ready_stabilization_delay:
      name: Utility Stabilization Delay
      description: >-
        Seconds to wait after the generator returns to "Ready" before
        restoring loads.
      default: 60
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
    restore_loads:
      name: Restore Shed Loads
      description: >-
        Turn previously active shed entities (not already off, unavailable, or
        unknown) back on after utility power stabilizes.
      default: true
      selector:
        boolean: {}
    restore_stagger_delay:
      name: Restore Stagger Delay
      description: >-
        Optional delay between turning each shed entity back on to avoid
        inrush spikes (0 restores all entities without pausing).
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: seconds

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input generator_status
    to: "Running"

variables:
  shed_entities: !input shed_entities
  restore_loads: !input restore_loads
  restore_stagger_delay: !input restore_stagger_delay

actions:
  - variables:
      shed_list: "{{ [shed_entities] if shed_entities is string else shed_entities }}"
      entities_to_restore: >-
        {{ shed_list | select('has_value') | reject('is_state', 'off') | list }}
  - alias: Keep high-draw loads shed until generator stabilizes in Ready
    repeat:
      sequence:
        - alias: Shed high-draw loads
          action: homeassistant.turn_off
          target:
            entity_id: !input shed_entities
        - alias: Wait for generator to stabilize in Ready or re-enter Running
          wait_for_trigger:
            - id: ready
              trigger: state
              entity_id: !input generator_status
              to: "Ready"
              for:
                seconds: !input ready_stabilization_delay
            - id: running_again
              trigger: state
              entity_id: !input generator_status
              to: "Running"
      until:
        - condition: template
          value_template: "{{ wait.trigger is not none and wait.trigger.id == 'ready' }}"
  - if:
      - condition: template
        value_template: "{{ restore_loads and (entities_to_restore | length > 0) }}"
    then:
      - alias: Restore shed loads
        repeat:
          for_each: "{{ entities_to_restore }}"
          sequence:
            - action: homeassistant.turn_on
              target:
                entity_id: "{{ repeat.item }}"
            - if:
                - condition: template
                  value_template: "{{ (restore_stagger_delay | int(0)) > 0 and not repeat.last }}"
              then:
                - delay:
                    seconds: !input restore_stagger_delay
